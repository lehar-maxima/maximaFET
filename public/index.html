<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxima — Field Events Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css" />
</head>
<body>

  <div class="shell">

    <div class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 3L25 22H3L14 3Z" fill="#064ADC" opacity=".15"/>
          <path d="M14 7L22 21H6L14 7Z" fill="#064ADC" opacity=".4"/>
          <path d="M14 12L19 21H9L14 12Z" fill="#064ADC"/>
        </svg>
        <div>
          <div class="brand-title"><span class="pulse"></span>Field events tracker</div>
          <div class="brand-sub">Maxima competitive intelligence</div>
        </div>
      </div>
      <button class="scan-btn" id="runBtn" onclick="runScan()">
        <i class="ti ti-radar"></i> Run weekly scan
      </button>
    </div>

    <div class="rival-row">
      <button class="chip on" onclick="setRival('all',this)">All six</button>
      <button class="chip" onclick="setRival('rillet',this)">Rillet</button>
      <button class="chip" onclick="setRival('numeric',this)">Numeric</button>
      <button class="chip" onclick="setRival('campfire',this)">Campfire</button>
      <button class="chip" onclick="setRival('klarity',this)">Klarity</button>
      <button class="chip" onclick="setRival('floqast',this)">FloQast</button>
      <button class="chip" onclick="setRival('blackline',this)">BlackLine</button>
    </div>

    <div id="summaryRow" class="summary-row" style="display:none;">
      <div class="scard"><div class="n" id="evtCount">0</div><div class="l">events found</div></div>
      <div class="scard"><div class="n" id="rivalCount">0</div><div class="l">rivals active</div></div>
      <div class="scard"><div class="n" id="hotCity" style="font-size:13px;padding-top:5px;">—</div><div class="l">top city</div></div>
    </div>

    <div class="area" id="area">
      <div class="empty">
        <i class="ti ti-calendar-search"></i>
        <strong>Ready to scan</strong>
        <span>Searches LinkedIn, event pages, and the web for field events, dinners, roundtables, and conferences from all six competitors. Real sources only.</span>
      </div>
    </div>

    <p class="footer-note" id="footNote" style="display:none;"></p>

  </div>

  <script src="app.js"></script>
</body>
</html>
